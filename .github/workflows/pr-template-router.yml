name: PR Template Router

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  route-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply correct template based on base branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const base = context.payload.pull_request.base.ref;

            let templatePath = null;
            if (base === 'staging') {
              templatePath = '.github/PULL_REQUEST_TEMPLATE/staging.md';
            } else if (base === 'prod') {
              templatePath = '.github/PULL_REQUEST_TEMPLATE/prod.md';
            }
            // base === 'dev' -> default template already applied by GitHub, do nothing

            if (templatePath && fs.existsSync(templatePath)) {
              const templateContent = fs.readFileSync(templatePath, 'utf8');
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: templateContent,
              });
            }
